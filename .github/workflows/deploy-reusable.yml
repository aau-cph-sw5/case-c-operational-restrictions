name: Reusable Deployment
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      target_dir:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 
        
      # 1. Copy the necessary files to the server
      - name: Copy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}

          # Files/folders that we copy
          source: "."

          # Folder on the server where everything is placed
          target: ${{ inputs.target_dir }}

      # 2. Build and start the containers on the server
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: DOMAIN,JWT_SIGNING_KEY
          script: |
            cd ${{ inputs.target_dir }}

            export BRANCH_NAME="${{ inputs.environment }}"
            export JWT_SIGNING_KEY="${JWT_SIGNING_KEY}"
            export DOMAIN="${DOMAIN}"

            echo "Building and starting containers for ${{ inputs.environment }}..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans || true
            
            # --- SEQUENTIAL BUILD START ---
            echo "Building backend..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend
            
            echo "Building frontend..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend
            # --- SEQUENTIAL BUILD END ---
            
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            docker image prune -f
            
            echo "${{ inputs.environment }} deployment finished!"