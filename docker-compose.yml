services:
  postgres:
    image: postgres:17
    container_name: metro-postgres-${BRANCH_NAME:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-metro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metro} -d ${POSTGRES_DB:-metro}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: dev
    container_name: metro-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-metro};Username=${POSTGRES_USER:-metro};Password=${POSTGRES_PASSWORD:-metro_local_pw}
      - Jwt__SigningKey=dev-only-key-at-least-32-characters-long
    volumes:
      - ./Backend:/app
      - /app/bin
      - /app/obj
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: metro-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net: