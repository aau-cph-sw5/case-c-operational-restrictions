services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: metro-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: metro-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
