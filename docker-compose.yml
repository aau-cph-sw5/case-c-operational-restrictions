services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: metro-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metro-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
