services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: dev
    container_name: metro-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=metro;Username=metro;Password=${POSTGRES_PASSWORD}
    volumes:
      - ./Backend:/app
      - /app/bin
      - /app/obj
    depends_on:
      postgres:
        condition: service_healthy  
    networks:
      - backend-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: metro-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - BACKEND_URL=http://backend:8080
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgres:17
    container_name: metro-postgres-${BRANCH_NAME:-dev}
    restart: unless-stopped
    environment:
      POSTGRES_DB: metro
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro"]
      interval: 5s
      timeout: 5s
      retries: 5 
       
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net: